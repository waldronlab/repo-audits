name: PR CMD check & build site

on:
  pull_request:
  push:
    paths:
      - 'DESCRIPTION'
      - '**.yml'
    branches:
      - devel
      - 'RELEASE_*'

jobs:
  ci:
    uses: waldronlab/.github/.github/workflows/bioc-pr-cmdcheck-pkgdown.yml@devel
    with:
      enable_pkgdown: true
      enable_docker: true
      dockerfile_path: inst/docker/pkg/Dockerfile
    secrets: inherit
    permissions:
      contents: write
      pages: write
      id-token: write
