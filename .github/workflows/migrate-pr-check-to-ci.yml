name: Migrate pr_check.yml to ci.yml

on:
  workflow_dispatch:
    inputs:
      repo:
        description: >
          Repository name within the waldronlab organisation to migrate
          (e.g. MultiAssayExperiment)
        required: true
        type: string
      branch:
        description: >
          Target branch to search and open PRs against
          (e.g. devel, RELEASE_3_22)
        required: false
        type: string
        default: devel
      dry_run:
        description: >
          Dry run – perform all checks and show what would change,
          but do NOT push branches, commits, or open PRs
        required: false
        type: boolean
        default: false

env:
  ORG: waldronlab

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout repo-audits (for scripts/ci.yml and PR body template)
      # -----------------------------------------------------------------------
      - name: Checkout repo-audits
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. List all repositories that still need migration (informational)
      # -----------------------------------------------------------------------
      - name: List un-migrated repositories
        env:
          GH_TOKEN: ${{ secrets.AUDIT_PAT }}
          TARGET_BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail

          echo "==> Searching for repos with pr_check.yml on branch '${TARGET_BRANCH}' …"
          REPOS=$(gh api --paginate \
            "search/code?q=filename:pr_check.yml+path:.github/workflows+org:${ORG}+ref:refs/heads/${TARGET_BRANCH}" \
            --jq '.items[].repository.name' \
            | sort -u || true)

          if [ -z "${REPOS}" ]; then
            echo "::notice::No repositories found with pr_check.yml on branch '${TARGET_BRANCH}'."
            exit 0
          fi

          UNMIGRATED=""
          for REPO in ${REPOS}; do
            if ! gh api \
              "repos/${ORG}/${REPO}/contents/.github/workflows/ci.yml?ref=${TARGET_BRANCH}" \
              > /dev/null 2>&1; then
              UNMIGRATED="${UNMIGRATED}  - ${REPO}\n"
            fi
          done

          if [ -z "${UNMIGRATED}" ]; then
            echo "::notice::All repositories with pr_check.yml on '${TARGET_BRANCH}' already have ci.yml – nothing left to migrate."
          else
            echo "==> Repositories still needing migration on branch '${TARGET_BRANCH}':"
            printf "%b" "${UNMIGRATED}"
          fi

      # -----------------------------------------------------------------------
      # 3. Check eligibility of the target repository
      # -----------------------------------------------------------------------
      - name: Check eligibility
        id: check
        env:
          GH_TOKEN: ${{ secrets.AUDIT_PAT }}
          TARGET_BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          REPO="${{ inputs.repo }}"

          echo "==> Checking ${ORG}/${REPO} …"

          # --- Fetch repo metadata -------------------------------------------
          if ! REPO_JSON=$(gh api "repos/${ORG}/${REPO}" 2>&1); then
            echo "::error::Repository ${ORG}/${REPO} not found or not accessible."
            exit 1
          fi

          IS_FORK=$(echo "${REPO_JSON}"     | jq -r '.fork')
          IS_ARCHIVED=$(echo "${REPO_JSON}" | jq -r '.archived')

          if [ "${IS_FORK}" = "true" ]; then
            echo "::notice::Skipping ${REPO} – it is a fork."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [ "${IS_ARCHIVED}" = "true" ]; then
            echo "::notice::Skipping ${REPO} – it is archived."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Require the target branch to exist
          if ! gh api "repos/${ORG}/${REPO}/branches/${TARGET_BRANCH}" > /dev/null 2>&1; then
            echo "::notice::Skipping ${REPO} – branch '${TARGET_BRANCH}' not found."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Confirm pr_check.yml exists on the target branch
          PR_CHECK_SHA=$(gh api \
            "repos/${ORG}/${REPO}/contents/.github/workflows/pr_check.yml?ref=${TARGET_BRANCH}" \
            --jq '.sha' 2>/dev/null || true)
          if [ -z "${PR_CHECK_SHA}" ]; then
            echo "::notice::Skipping ${REPO} – pr_check.yml not found on '${TARGET_BRANCH}'."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Skip if ci.yml already exists on the target branch
          if gh api \
            "repos/${ORG}/${REPO}/contents/.github/workflows/ci.yml?ref=${TARGET_BRANCH}" \
            > /dev/null 2>&1; then
            echo "::notice::Skipping ${REPO} – ci.yml already exists on '${TARGET_BRANCH}'."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Skip if a migration PR already exists
          EXISTING_PR=$(gh pr list \
            --repo "${ORG}/${REPO}" \
            --state open \
            --search "Migrate pr_check.yml to ci.yml in:title" \
            --json number \
            --jq '.[0].number' 2>/dev/null || true)
          if [ -n "${EXISTING_PR}" ]; then
            echo "::notice::Skipping ${REPO} – migration PR #${EXISTING_PR} already open."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "skip=false" >> "${GITHUB_OUTPUT}"
          echo "==> ${REPO} is eligible for migration."

      # -----------------------------------------------------------------------
      # 4. Create branch and open PR (real run)
      # -----------------------------------------------------------------------
      - name: Create branch and open PR
        if: >
          steps.check.outputs.skip == 'false' &&
          inputs.dry_run == false
        env:
          GH_TOKEN: ${{ secrets.AUDIT_PAT }}
          TARGET_BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          REPO="${{ inputs.repo }}"
          BRANCH="ci/migrate-pr-check-to-ci-yml-${{ github.run_id }}"

          # ── ci.yml content – read from scripts/ci.yml in this repo ──
          CI_YML=$(base64 -w 0 "${{ github.workspace }}/scripts/ci.yml")

          # ── Create a branch off the target branch ──
          BASE_SHA=$(gh api "repos/${ORG}/${REPO}/branches/${TARGET_BRANCH}" \
                       --jq '.commit.sha')

          gh api "repos/${ORG}/${REPO}/git/refs" \
            --method POST \
            --field "ref=refs/heads/${BRANCH}" \
            --field "sha=${BASE_SHA}"
          echo "  Created branch: ${BRANCH} (off ${TARGET_BRANCH})"

          # ── Add ci.yml ──
          gh api "repos/${ORG}/${REPO}/contents/.github/workflows/ci.yml" \
            --method PUT \
            --field "message=Add ci.yml reusable-workflow wrapper" \
            --field "content=${CI_YML}" \
            --field "branch=${BRANCH}"
          echo "  Added .github/workflows/ci.yml"

          # ── Re-fetch pr_check.yml SHA from the new branch immediately before
          #    deleting, to avoid stale-SHA errors. ──
          PR_CHECK_SHA=$(gh api \
            "repos/${ORG}/${REPO}/contents/.github/workflows/pr_check.yml?ref=${BRANCH}" \
            --jq '.sha')

          gh api "repos/${ORG}/${REPO}/contents/.github/workflows/pr_check.yml" \
            --method DELETE \
            --field "message=Remove pr_check.yml (replaced by ci.yml)" \
            --field "sha=${PR_CHECK_SHA}" \
            --field "branch=${BRANCH}"
          echo "  Deleted .github/workflows/pr_check.yml"

          # ── Build PR body ──
          PR_BODY_FILE=$(mktemp)
          cat "${{ github.workspace }}/scripts/migrate-pr-check-pr-body.md" > "${PR_BODY_FILE}"
          printf '\nOpened by the [repo-audits](https://github.com/waldronlab/repo-audits) workflow (run [#%s](%s/%s/actions/runs/%s)).\n' \
            "${{ github.run_id }}" \
            "${{ github.server_url }}" \
            "${{ github.repository }}" \
            "${{ github.run_id }}" >> "${PR_BODY_FILE}"

          # ── Open PR ──
          gh pr create \
            --repo "${ORG}/${REPO}" \
            --base "${TARGET_BRANCH}" \
            --head "${BRANCH}" \
            --title "Migrate pr_check.yml to ci.yml" \
            --body-file "${PR_BODY_FILE}"

          rm -f "${PR_BODY_FILE}"

          echo "::notice::PR created in ${ORG}/${REPO} targeting '${TARGET_BRANCH}' (branch: ${BRANCH})."

      # -----------------------------------------------------------------------
      # 5. Dry-run summary
      # -----------------------------------------------------------------------
      - name: Dry-run summary
        if: >
          steps.check.outputs.skip == 'false' &&
          inputs.dry_run == true
        run: |
          echo "::notice::DRY RUN – would create migration PR in ${{ inputs.repo }} targeting '${{ inputs.branch }}'."

      # -----------------------------------------------------------------------
      # 6. Nothing to do
      # -----------------------------------------------------------------------
      - name: No migration needed
        if: steps.check.outputs.skip == 'true'
        run: |
          echo "::notice::${{ inputs.repo }} does not need migration – skipped."

