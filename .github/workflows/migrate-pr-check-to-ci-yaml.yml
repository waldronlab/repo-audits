name: Migrate pr_check.yml to ci.yaml

on:
  workflow_dispatch:
    inputs:
      branch:
        description: >
          Target branch to search and open PRs against
          (e.g. devel, RELEASE_3_22)
        required: false
        type: string
        default: devel
      dry_run:
        description: >
          Dry run – perform all checks and show what would change,
          but do NOT push branches, commits, or open PRs
        required: false
        type: boolean
        default: false

env:
  ORG: waldronlab

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout repo-audits (for context / traceability)
      # -----------------------------------------------------------------------
      - name: Checkout repo-audits
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Discover repos and create migration PRs
      # -----------------------------------------------------------------------
      - name: Create PRs to migrate pr_check.yml to ci.yaml
        env:
          GH_TOKEN: ${{ secrets.AUDIT_PAT }}
          TARGET_BRANCH: ${{ inputs.branch }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          # ── ci.yaml content – read from scripts/ci.yaml in this repo ──
          CI_YAML=$(base64 -w 0 "${{ github.workspace }}/scripts/ci.yaml")

          # ── Find every waldronlab repo that has .github/workflows/pr_check.yml
          #    on the target branch (ref: qualifier restricts the search) ──
          echo "==> Searching for repos with pr_check.yml on branch '${TARGET_BRANCH}' …"
          REPOS=$(gh api --paginate \
            "search/code?q=filename:pr_check.yml+path:.github/workflows+org:${ORG}+ref:refs/heads/${TARGET_BRANCH}" \
            --jq '.items[].repository.name' \
            | sort -u)

          if [ -z "${REPOS}" ]; then
            echo "::notice::No repositories found with .github/workflows/pr_check.yml on branch '${TARGET_BRANCH}' – nothing to do."
            exit 0
          fi

          echo "==> Found repos:"
          echo "${REPOS}" | sed 's/^/  - /'

          # ── Process each repo ──
          for REPO in ${REPOS}; do
            echo ""
            echo "==> Processing ${ORG}/${REPO} …"

            # Skip archived repos
            IS_ARCHIVED=$(gh api "repos/${ORG}/${REPO}" --jq '.archived')
            if [ "${IS_ARCHIVED}" = "true" ]; then
              echo "::notice::Skipping ${REPO} – it is archived."
              continue
            fi

            # Skip forks
            IS_FORK=$(gh api "repos/${ORG}/${REPO}" --jq '.fork')
            if [ "${IS_FORK}" = "true" ]; then
              echo "::notice::Skipping ${REPO} – it is a fork."
              continue
            fi

            # Require the target branch to exist
            if ! gh api "repos/${ORG}/${REPO}/branches/${TARGET_BRANCH}" > /dev/null 2>&1; then
              echo "::notice::Skipping ${REPO} – branch '${TARGET_BRANCH}' not found."
              continue
            fi

            # Confirm pr_check.yml actually exists on the target branch
            PR_CHECK_SHA=$(gh api \
              "repos/${ORG}/${REPO}/contents/.github/workflows/pr_check.yml?ref=${TARGET_BRANCH}" \
              --jq '.sha' 2>/dev/null || true)
            if [ -z "${PR_CHECK_SHA}" ]; then
              echo "::notice::Skipping ${REPO} – pr_check.yml not found on '${TARGET_BRANCH}'."
              continue
            fi

            # Skip if ci.yaml or ci.yml already exists on the target branch
            if gh api \
              "repos/${ORG}/${REPO}/contents/.github/workflows/ci.yaml?ref=${TARGET_BRANCH}" \
              > /dev/null 2>&1 || \
               gh api \
              "repos/${ORG}/${REPO}/contents/.github/workflows/ci.yml?ref=${TARGET_BRANCH}" \
              > /dev/null 2>&1; then
              echo "::notice::Skipping ${REPO} – ci.yaml or ci.yml already exists on '${TARGET_BRANCH}'."
              continue
            fi

            # Skip if a migration PR already exists
            EXISTING_PR=$(gh pr list \
              --repo "${ORG}/${REPO}" \
              --state open \
              --search "Migrate pr_check.yml to ci.yaml in:title" \
              --json number \
              --jq '.[0].number' 2>/dev/null || true)
            if [ -n "${EXISTING_PR}" ]; then
              echo "::notice::Skipping ${REPO} – migration PR #${EXISTING_PR} already open."
              continue
            fi

            if [ "${DRY_RUN}" = "true" ]; then
              echo "::notice::DRY RUN – would create migration PR in ${ORG}/${REPO} (base: ${TARGET_BRANCH})."
              continue
            fi

            # ── Create a branch off the target branch ──
            BRANCH="ci/migrate-pr-check-to-ci-yaml-${{ github.run_id }}"
            BASE_SHA=$(gh api "repos/${ORG}/${REPO}/branches/${TARGET_BRANCH}" \
                         --jq '.commit.sha')

            gh api "repos/${ORG}/${REPO}/git/refs" \
              --method POST \
              --field "ref=refs/heads/${BRANCH}" \
              --field "sha=${BASE_SHA}"
            echo "  Created branch: ${BRANCH} (off ${TARGET_BRANCH})"

            # ── Add ci.yaml ──
            gh api "repos/${ORG}/${REPO}/contents/.github/workflows/ci.yaml" \
              --method PUT \
              --field "message=Add ci.yaml reusable-workflow wrapper" \
              --field "content=${CI_YAML}" \
              --field "branch=${BRANCH}"
            echo "  Added .github/workflows/ci.yaml"

            # ── Re-fetch pr_check.yml SHA from the new branch immediately before
            #    deleting, to avoid stale-SHA errors if the file was concurrently
            #    updated on the base branch. ──
            CURRENT_PR_CHECK_SHA=$(gh api \
              "repos/${ORG}/${REPO}/contents/.github/workflows/pr_check.yml?ref=${BRANCH}" \
              --jq '.sha')

            gh api "repos/${ORG}/${REPO}/contents/.github/workflows/pr_check.yml" \
              --method DELETE \
              --field "message=Remove pr_check.yml (replaced by ci.yaml)" \
              --field "sha=${CURRENT_PR_CHECK_SHA}" \
              --field "branch=${BRANCH}"
            echo "  Deleted .github/workflows/pr_check.yml"

            # ── Build PR body ──
            PR_BODY_FILE=$(mktemp)
            cat "${{ github.workspace }}/scripts/migrate-pr-check-pr-body.md" > "${PR_BODY_FILE}"
            printf '\nOpened by the [repo-audits](https://github.com/waldronlab/repo-audits) workflow (run [#%s](%s/%s/actions/runs/%s)).\n' \
              "${{ github.run_id }}" \
              "${{ github.server_url }}" \
              "${{ github.repository }}" \
              "${{ github.run_id }}" >> "${PR_BODY_FILE}"

            # ── Open PR ──
            gh pr create \
              --repo "${ORG}/${REPO}" \
              --base "${TARGET_BRANCH}" \
              --head "${BRANCH}" \
              --title "Migrate pr_check.yml to ci.yaml" \
              --body-file "${PR_BODY_FILE}"

            rm -f "${PR_BODY_FILE}"

            echo "::notice::PR created in ${ORG}/${REPO} targeting '${TARGET_BRANCH}' (branch: ${BRANCH})."
          done

          echo ""
          echo "==> Migration complete."

