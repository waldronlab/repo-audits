name: Add or update CITATION.cff for a package

on:
  workflow_dispatch:
    inputs:
      repo:
        description: >
          Repository name within the organisation to add or update
          CITATION.cff for (e.g. MultiAssayExperiment)
        required: true
        type: string
      branch:
        description: >
          Target branch to open the PR against
          (e.g. devel, RELEASE_3_22)
        required: false
        type: string
        default: devel
      dry_run:
        description: >
          Dry run – perform all checks and show what would change,
          but do NOT push branches, commits, or open PRs
        required: false
        type: boolean
        default: false

env:
  ORG: waldronlab
  CRAN: "https://p3m.dev/cran/__linux__/noble/latest"

jobs:
  update-citation-cff:
    runs-on: ubuntu-latest
    container: ghcr.io/bioconductor/bioconductor_docker:devel
    permissions:
      contents: read

    steps:
      # -----------------------------------------------------------------------
      # 0a. Install system tools (gh CLI, jq) not present in the container
      # -----------------------------------------------------------------------
      - name: Install system tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends jq curl
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            | tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          apt-get update -qq
          apt-get install -y gh

      # -----------------------------------------------------------------------
      # 0b. Checkout repo-audits@devel so scripts/ are available locally
      # -----------------------------------------------------------------------
      - uses: actions/checkout@v4
        with:
          ref: devel

      # -----------------------------------------------------------------------
      # 1. Check eligibility of the target repository
      # -----------------------------------------------------------------------
      - name: Check eligibility
        id: check
        env:
          GH_TOKEN: ${{ secrets.AUDIT_PAT }}
          TARGET_BRANCH: ${{ inputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="${{ inputs.repo }}"

          echo "==> Checking ${ORG}/${REPO} …"

          # --- Fetch repo metadata -------------------------------------------
          if ! REPO_JSON=$(gh api "repos/${ORG}/${REPO}" 2>&1); then
            echo "::error::Repository ${ORG}/${REPO} not found or not accessible."
            exit 1
          fi

          IS_FORK=$(echo "${REPO_JSON}"     | jq -r '.fork')
          IS_ARCHIVED=$(echo "${REPO_JSON}" | jq -r '.archived')

          if [ "${IS_FORK}" = "true" ]; then
            echo "::notice::Skipping ${REPO} – it is a fork."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [ "${IS_ARCHIVED}" = "true" ]; then
            echo "::notice::Skipping ${REPO} – it is archived."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Require the target branch to exist
          if ! gh api "repos/${ORG}/${REPO}/branches/${TARGET_BRANCH}" > /dev/null 2>&1; then
            echo "::notice::Skipping ${REPO} – branch '${TARGET_BRANCH}' not found."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Require DESCRIPTION to exist on the target branch (R package check)
          if ! gh api \
            "repos/${ORG}/${REPO}/contents/DESCRIPTION?ref=${TARGET_BRANCH}" \
            > /dev/null 2>&1; then
            echo "::notice::Skipping ${REPO} – DESCRIPTION not found on '${TARGET_BRANCH}' (not an R package?)."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "skip=false" >> "${GITHUB_OUTPUT}"
          echo "==> ${REPO} is eligible – CITATION.cff will be added or updated."

      # -----------------------------------------------------------------------
      # 2. Install R packages required for CFF generation
      # -----------------------------------------------------------------------
      - name: Install R packages
        if: steps.check.outputs.skip == 'false'
        shell: Rscript {0}
        run: |
          options(repos = c(CRAN = Sys.getenv("CRAN")))
          BiocManager::install(c("remotes", "cffr", "V8"), ask = FALSE)

      # -----------------------------------------------------------------------
      # 3. Generate CITATION.cff via cffr::cff_write()
      #
      #    The target package is installed from the cloned source first so
      #    that citation() can locate it, then cff_write() is called with the
      #    package name.  The auto-citation (derived from DESCRIPTION) is
      #    included as a references entry so both the preferred-citation and
      #    the software citation appear in CITATION.cff.
      # -----------------------------------------------------------------------
      - name: Generate CITATION.cff
        id: generate
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.AUDIT_PAT }}
          TARGET_BRANCH: ${{ inputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="${{ inputs.repo }}"

          WORK_DIR=$(mktemp -d)
          NEW_CFF_B64_FILE=$(mktemp)

          # ── Clone the target repo at the target branch ──
          gh repo clone "${ORG}/${REPO}" "${WORK_DIR}" -- \
            --branch "${TARGET_BRANCH}" --depth 1
          echo "  Cloned ${ORG}/${REPO}@${TARGET_BRANCH}"

          # ── Check whether CITATION.cff already exists (needed for the PUT SHA) ──
          # Treat any failure (404 = not found, or other) as "does not exist";
          # a genuine permission error will surface in the commit step.
          if EXISTING_CFF_SHA=$(gh api \
              "repos/${ORG}/${REPO}/contents/CITATION.cff?ref=${TARGET_BRANCH}" \
              --jq '.sha' 2>/dev/null) && [ -n "${EXISTING_CFF_SHA}" ]; then
            echo "  CITATION.cff already exists (SHA: ${EXISTING_CFF_SHA}) – will update"
            CFF_EXISTS=true
          else
            EXISTING_CFF_SHA=""
            echo "  CITATION.cff does not yet exist – will add"
            CFF_EXISTS=false
          fi

          # ── Get the package name from DESCRIPTION ──
          PKG_NAME=$(grep '^Package:' "${WORK_DIR}/DESCRIPTION" | sed 's/^Package:[[:space:]]*//')
          echo "  Package name: ${PKG_NAME}"

          # ── Install the package and generate CITATION.cff ──
          R_SCRIPT=$(mktemp --suffix=.R)
          cat > "${R_SCRIPT}" << 'REOF'
          library(cffr)
          work_dir <- Sys.getenv("WORK_DIR")
          pkg      <- Sys.getenv("PKG_NAME")

          # Install the package from the local clone so that citation() can
          # find it by name.  remotes::install_local resolves and installs
          # dependencies from Bioconductor repositories; --no-test-load avoids
          # load-time errors from missing optional dependencies;
          # --no-build-vignettes skips vignette compilation (which could fail)
          # since we only need the package metadata accessible for citation().
          options(repos = c(CRAN = Sys.getenv("CRAN")))
          remotes::install_local(
            work_dir,
            repos = BiocManager::repositories(),
            INSTALL_opts = c("--no-test-load", "--no-build-vignettes"),
            upgrade = "never"
          )

          # Generate and write CITATION.cff from the installed package.
          # citation(pkg, auto = TRUE) auto-generates from DESCRIPTION when no
          # inst/CITATION is present; as_cff() converts to CFF format.
          setwd(work_dir)
          cit <- citation(pkg, auto = TRUE)
          cff_write(
            pkg,
            keys = list(
              references = as.list(as_cff(cit))
            )
          )
          REOF
          WORK_DIR="${WORK_DIR}" PKG_NAME="${PKG_NAME}" CRAN="${CRAN}" Rscript "${R_SCRIPT}"
          rm -f "${R_SCRIPT}"
          echo "  Generated CITATION.cff"

          # ── Base64-encode the generated file ──
          base64 -w0 < "${WORK_DIR}/CITATION.cff" > "${NEW_CFF_B64_FILE}"

          echo "work_dir=${WORK_DIR}"                     >> "${GITHUB_OUTPUT}"
          echo "new_cff_b64_file=${NEW_CFF_B64_FILE}"     >> "${GITHUB_OUTPUT}"
          echo "cff_exists=${CFF_EXISTS}"                 >> "${GITHUB_OUTPUT}"
          echo "existing_cff_sha=${EXISTING_CFF_SHA}"     >> "${GITHUB_OUTPUT}"

      # -----------------------------------------------------------------------
      # 4. Create new PR (real run)
      #
      #    Each run always opens a fresh PR so that changes at different time
      #    points are reviewed independently.
      # -----------------------------------------------------------------------
      - name: Create PR
        if: >
          steps.check.outputs.skip == 'false' &&
          inputs.dry_run == false
        env:
          GH_TOKEN: ${{ secrets.AUDIT_PAT }}
          TARGET_BRANCH: ${{ inputs.branch }}
          WORK_DIR: ${{ steps.generate.outputs.work_dir }}
          NEW_CFF_B64_FILE: ${{ steps.generate.outputs.new_cff_b64_file }}
          CFF_EXISTS: ${{ steps.generate.outputs.cff_exists }}
          EXISTING_CFF_SHA: ${{ steps.generate.outputs.existing_cff_sha }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="${{ inputs.repo }}"

          if [ "${CFF_EXISTS}" = "true" ]; then
            ACTION="Update"
          else
            ACTION="Add"
          fi

          BRANCH="ci/update-citation-cff-${{ github.run_id }}"

          # ── Create the branch off the target branch ──
          BASE_SHA=$(gh api "repos/${ORG}/${REPO}/branches/${TARGET_BRANCH}" \
                       --jq '.commit.sha')
          gh api "repos/${ORG}/${REPO}/git/refs" \
            --method POST \
            --field "ref=refs/heads/${BRANCH}" \
            --field "sha=${BASE_SHA}"
          echo "  Created branch: ${BRANCH} (off ${TARGET_BRANCH})"

          # ── Commit CITATION.cff (include SHA when updating an existing file) ──
          PUT_ARGS=(
            --method PUT
            --field "message=${ACTION} CITATION.cff"
            --field "content=$(cat "${NEW_CFF_B64_FILE}")"
            --field "branch=${BRANCH}"
          )
          if [ "${CFF_EXISTS}" = "true" ]; then
            PUT_ARGS+=(--field "sha=${EXISTING_CFF_SHA}")
          fi
          if ! gh api "repos/${ORG}/${REPO}/contents/CITATION.cff" "${PUT_ARGS[@]}"; then
            echo "::error::Failed to commit CITATION.cff to ${BRANCH} in ${ORG}/${REPO}. Check that AUDIT_PAT has write access."
            exit 1
          fi
          echo "  ${ACTION}d CITATION.cff"

          # ── Build PR body ──
          PR_BODY_FILE=$(mktemp)
          cp scripts/update-citation-cff-pr-body.md "${PR_BODY_FILE}"

          printf '\nOpened by the [repo-audits](https://github.com/waldronlab/repo-audits) workflow (run [#%s](%s/%s/actions/runs/%s)).\n' \
            "${{ github.run_id }}" \
            "${{ github.server_url }}" \
            "${{ github.repository }}" \
            "${{ github.run_id }}" >> "${PR_BODY_FILE}"

          # ── Open PR ──
          gh pr create \
            --repo "${ORG}/${REPO}" \
            --base "${TARGET_BRANCH}" \
            --head "${BRANCH}" \
            --title "${ACTION} CITATION.cff" \
            --body-file "${PR_BODY_FILE}"

          rm -rf "${WORK_DIR}"
          rm -f "${PR_BODY_FILE}"

          echo "::notice::PR created in ${ORG}/${REPO} targeting '${TARGET_BRANCH}' (branch: ${BRANCH})."

      # -----------------------------------------------------------------------
      # 5. Dry-run summary
      # -----------------------------------------------------------------------
      - name: Dry-run summary
        if: >
          steps.check.outputs.skip == 'false' &&
          inputs.dry_run == true
        env:
          WORK_DIR: ${{ steps.generate.outputs.work_dir }}
          CFF_EXISTS: ${{ steps.generate.outputs.cff_exists }}
        run: |
          REPO="${{ inputs.repo }}"
          if [ "${CFF_EXISTS}" = "true" ]; then
            echo "::notice::DRY RUN – would update CITATION.cff in ${REPO} targeting '${{ inputs.branch }}'."
          else
            echo "::notice::DRY RUN – would add CITATION.cff to ${REPO} targeting '${{ inputs.branch }}'."
          fi
          echo "==> Generated CITATION.cff:"
          cat "${WORK_DIR}/CITATION.cff"
          rm -rf "${WORK_DIR}"

      # -----------------------------------------------------------------------
      # 6. Nothing to do
      # -----------------------------------------------------------------------
      - name: No action needed
        if: steps.check.outputs.skip == 'true'
        run: |
          echo "::notice::${{ inputs.repo }} was skipped – see above for reason."
