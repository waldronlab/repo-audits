name: Update CITATION.cff for a package

on:
  workflow_dispatch:
    inputs:
      repo:
        description: >
          Repository name within the waldronlab organisation to update
          CITATION.cff for (e.g. MultiAssayExperiment)
        required: true
        type: string
      branch:
        description: >
          Target branch to search and open PRs against
          (e.g. devel, RELEASE_3_22)
        required: false
        type: string
        default: devel
      dry_run:
        description: >
          Dry run – perform all checks and show what would change,
          but do NOT push branches, commits, or open PRs
        required: false
        type: boolean
        default: false

env:
  ORG: waldronlab

jobs:
  update-citation-cff:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # -----------------------------------------------------------------------
      # 0. Checkout repo-audits@devel so scripts/ are available locally
      # -----------------------------------------------------------------------
      - uses: actions/checkout@v4
        with:
          ref: devel

      # -----------------------------------------------------------------------
      # 1. Check eligibility of the target repository
      # -----------------------------------------------------------------------
      - name: Check eligibility
        id: check
        env:
          GH_TOKEN: ${{ secrets.AUDIT_PAT }}
          TARGET_BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          REPO="${{ inputs.repo }}"

          echo "==> Checking ${ORG}/${REPO} …"

          # --- Fetch repo metadata -------------------------------------------
          if ! REPO_JSON=$(gh api "repos/${ORG}/${REPO}" 2>&1); then
            echo "::error::Repository ${ORG}/${REPO} not found or not accessible."
            exit 1
          fi

          IS_FORK=$(echo "${REPO_JSON}"     | jq -r '.fork')
          IS_ARCHIVED=$(echo "${REPO_JSON}" | jq -r '.archived')

          if [ "${IS_FORK}" = "true" ]; then
            echo "::notice::Skipping ${REPO} – it is a fork."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [ "${IS_ARCHIVED}" = "true" ]; then
            echo "::notice::Skipping ${REPO} – it is archived."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Require the target branch to exist
          if ! gh api "repos/${ORG}/${REPO}/branches/${TARGET_BRANCH}" > /dev/null 2>&1; then
            echo "::notice::Skipping ${REPO} – branch '${TARGET_BRANCH}' not found."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Require DESCRIPTION to exist on the target branch (R package check)
          if ! gh api \
            "repos/${ORG}/${REPO}/contents/DESCRIPTION?ref=${TARGET_BRANCH}" \
            > /dev/null 2>&1; then
            echo "::notice::Skipping ${REPO} – DESCRIPTION not found on '${TARGET_BRANCH}' (not an R package?)."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "skip=false" >> "${GITHUB_OUTPUT}"
          echo "==> ${REPO} is eligible – inst/CITATION and CITATION.cff will be updated."

      # -----------------------------------------------------------------------
      # 2. Set up R (only when we will actually run)
      # -----------------------------------------------------------------------
      - uses: r-lib/actions/setup-r@v2
        if: steps.check.outputs.skip == 'false'
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: steps.check.outputs.skip == 'false'
        with:
          # packages: "" prevents setup-r-dependencies from looking for a
          # DESCRIPTION in the repo-audits checkout directory (which has none).
          # Only the explicitly listed extra-packages are installed.
          packages: ""
          extra-packages: |
            any::cffr
            any::V8

      # -----------------------------------------------------------------------
      # 3. Generate inst/CITATION and CITATION.cff, keeping them in sync
      #
      #    The auto citation (from DESCRIPTION) is written to inst/CITATION so
      #    R users always get an up-to-date citation entry.  cff_write() then
      #    picks that up as the preferred-citation in CITATION.cff, ensuring
      #    both files are derived from the same source.
      #
      #    Runs for both real runs and dry runs so both paths can show output.
      # -----------------------------------------------------------------------
      - name: Generate inst/CITATION and CITATION.cff
        id: generate
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.AUDIT_PAT }}
          TARGET_BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          REPO="${{ inputs.repo }}"

          WORK_DIR=$(mktemp -d)
          AUTO_CIT_FILE=$(mktemp)
          NEW_CFF_B64_FILE=$(mktemp)
          NEW_INST_CIT_B64_FILE=$(mktemp)

          # ── Clone the target repo at the target branch ──
          gh repo clone "${ORG}/${REPO}" "${WORK_DIR}" -- \
            --branch "${TARGET_BRANCH}" --depth 1
          echo "  Cloned ${ORG}/${REPO}@${TARGET_BRANCH}"

          # ── R script ──
          # 1. Derive the auto citation from DESCRIPTION (no inst/CITATION needed).
          # 2. Write it to inst/CITATION so R users get an up-to-date entry and
          #    cff_write() picks it up as preferred-citation.
          # 3. Write CITATION.cff via cff_write() – both files now share the
          #    same metadata source and are in sync.
          R_SCRIPT=$(mktemp --suffix=.R)
          cat > "${R_SCRIPT}" << 'REOF'
          library(cffr)
          setwd(Sys.getenv("WORK_DIR"))

          # Auto citation: strip any existing preferred-citation so we work
          # purely from DESCRIPTION.
          cff_obj <- tryCatch(
            cff(),
            error = function(e) stop("cff() failed – check DESCRIPTION: ", conditionMessage(e))
          )
          cff_obj[["preferred-citation"]] <- NULL
          auto_bib <- tryCatch(
            cff_to_bibentry(cff_obj),
            error = function(e) stop("cff_to_bibentry() failed: ", conditionMessage(e))
          )

          # Write inst/CITATION (creates inst/ if absent).
          dir.create("inst", showWarnings = FALSE, recursive = TRUE)
          writeLines(format(auto_bib, style = "R"), "inst/CITATION")

          # Regenerate CITATION.cff; cff_write() now sees inst/CITATION and
          # uses it as preferred-citation.
          tryCatch(
            cff_write(),
            error = function(e) stop("cff_write() failed: ", conditionMessage(e))
          )

          # Save the auto citation text for the PR body.
          writeLines(format(auto_bib, style = "R"), Sys.getenv("AUTO_CIT_FILE"))
          REOF
          WORK_DIR="${WORK_DIR}" AUTO_CIT_FILE="${AUTO_CIT_FILE}" Rscript "${R_SCRIPT}"
          rm -f "${R_SCRIPT}"
          echo "  Generated inst/CITATION and CITATION.cff"

          # ── Base64-encode both generated files ──
          base64 -w0 < "${WORK_DIR}/CITATION.cff"      > "${NEW_CFF_B64_FILE}"
          base64 -w0 < "${WORK_DIR}/inst/CITATION"     > "${NEW_INST_CIT_B64_FILE}"

          # ── Compare both files against the target branch ──
          CURRENT_CFF_B64=$(gh api \
            "repos/${ORG}/${REPO}/contents/CITATION.cff?ref=${TARGET_BRANCH}" \
            --jq '.content' 2>/dev/null | tr -d '\n' || true)
          CURRENT_INST_CIT_B64=$(gh api \
            "repos/${ORG}/${REPO}/contents/inst/CITATION?ref=${TARGET_BRANCH}" \
            --jq '.content' 2>/dev/null | tr -d '\n' || true)

          FILES_CHANGED=false
          [ "$(cat "${NEW_CFF_B64_FILE}")"      != "${CURRENT_CFF_B64}"      ] && FILES_CHANGED=true
          [ "$(cat "${NEW_INST_CIT_B64_FILE}")" != "${CURRENT_INST_CIT_B64}" ] && FILES_CHANGED=true

          echo "work_dir=${WORK_DIR}"                               >> "${GITHUB_OUTPUT}"
          echo "auto_cit_file=${AUTO_CIT_FILE}"                     >> "${GITHUB_OUTPUT}"
          echo "new_cff_b64_file=${NEW_CFF_B64_FILE}"               >> "${GITHUB_OUTPUT}"
          echo "new_inst_cit_b64_file=${NEW_INST_CIT_B64_FILE}"     >> "${GITHUB_OUTPUT}"
          echo "files_changed=${FILES_CHANGED}"                     >> "${GITHUB_OUTPUT}"
          echo "  Files changed: ${FILES_CHANGED}"

      # -----------------------------------------------------------------------
      # 4. Create new PR (real run)
      #
      #    Each run always opens a fresh PR so that changes at different time
      #    points are reviewed independently.
      # -----------------------------------------------------------------------
      - name: Create PR
        if: >
          steps.check.outputs.skip == 'false' &&
          inputs.dry_run == false
        env:
          GH_TOKEN: ${{ secrets.AUDIT_PAT }}
          TARGET_BRANCH: ${{ inputs.branch }}
          FILES_CHANGED: ${{ steps.generate.outputs.files_changed }}
          WORK_DIR: ${{ steps.generate.outputs.work_dir }}
          AUTO_CIT_FILE: ${{ steps.generate.outputs.auto_cit_file }}
          NEW_CFF_B64_FILE: ${{ steps.generate.outputs.new_cff_b64_file }}
          NEW_INST_CIT_B64_FILE: ${{ steps.generate.outputs.new_inst_cit_b64_file }}
        run: |
          set -euo pipefail
          REPO="${{ inputs.repo }}"

          if [ "${FILES_CHANGED}" = "false" ]; then
            echo "::notice::inst/CITATION and CITATION.cff are already up to date in ${ORG}/${REPO} – no PR needed."
            rm -rf "${WORK_DIR}"
            exit 0
          fi

          BRANCH="ci/update-citation-cff-${{ github.run_id }}"

          # ── Get the base commit and its tree ──
          BASE_SHA=$(gh api "repos/${ORG}/${REPO}/branches/${TARGET_BRANCH}" \
                       --jq '.commit.sha')
          BASE_TREE=$(gh api "repos/${ORG}/${REPO}/git/commits/${BASE_SHA}" \
                        --jq '.tree.sha')

          # ── Create blobs for both files ──
          CFF_BLOB=$(gh api "repos/${ORG}/${REPO}/git/blobs" \
            --method POST \
            --field "content=$(cat "${NEW_CFF_B64_FILE}")" \
            --field "encoding=base64" \
            --jq '.sha')

          INST_CIT_BLOB=$(gh api "repos/${ORG}/${REPO}/git/blobs" \
            --method POST \
            --field "content=$(cat "${NEW_INST_CIT_B64_FILE}")" \
            --field "encoding=base64" \
            --jq '.sha')

          # ── Create a new tree containing both files ──
          NEW_TREE=$(gh api "repos/${ORG}/${REPO}/git/trees" \
            --method POST \
            --field "base_tree=${BASE_TREE}" \
            --raw-field "tree=$(jq -n \
              --arg cff_sha  "${CFF_BLOB}" \
              --arg inst_sha "${INST_CIT_BLOB}" \
              '[
                {"path":"CITATION.cff",  "mode":"100644","type":"blob","sha":$cff_sha},
                {"path":"inst/CITATION","mode":"100644","type":"blob","sha":$inst_sha}
              ]')" \
            --jq '.sha')

          # ── Create the commit ──
          NEW_COMMIT=$(gh api "repos/${ORG}/${REPO}/git/commits" \
            --method POST \
            --field "message=Update inst/CITATION and CITATION.cff" \
            --field "tree=${NEW_TREE}" \
            --field "parents[]=${BASE_SHA}" \
            --jq '.sha')

          # ── Create branch pointing at the new commit ──
          gh api "repos/${ORG}/${REPO}/git/refs" \
            --method POST \
            --field "ref=refs/heads/${BRANCH}" \
            --field "sha=${NEW_COMMIT}"
          echo "  Created branch: ${BRANCH} (off ${TARGET_BRANCH})"

          # ── Build PR body ──
          PR_BODY_FILE=$(mktemp)
          cp scripts/update-citation-cff-pr-body.md "${PR_BODY_FILE}"

          printf '\n## Auto-generated citation\n\nThe auto-generated citation derived from `DESCRIPTION` (equivalent to `citation("%s", auto = TRUE)`):\n\n```r\n' "${REPO}" >> "${PR_BODY_FILE}"
          cat "${AUTO_CIT_FILE}" >> "${PR_BODY_FILE}"
          printf '\n```\n' >> "${PR_BODY_FILE}"

          printf '\nOpened by the [repo-audits](https://github.com/waldronlab/repo-audits) workflow (run [#%s](%s/%s/actions/runs/%s)).\n' \
            "${{ github.run_id }}" \
            "${{ github.server_url }}" \
            "${{ github.repository }}" \
            "${{ github.run_id }}" >> "${PR_BODY_FILE}"

          # ── Open PR ──
          gh pr create \
            --repo "${ORG}/${REPO}" \
            --base "${TARGET_BRANCH}" \
            --head "${BRANCH}" \
            --title "Update inst/CITATION and CITATION.cff" \
            --body-file "${PR_BODY_FILE}"

          rm -rf "${WORK_DIR}"
          rm -f "${PR_BODY_FILE}"

          echo "::notice::PR created in ${ORG}/${REPO} targeting '${TARGET_BRANCH}' (branch: ${BRANCH})."

      # -----------------------------------------------------------------------
      # 5. Dry-run summary
      # -----------------------------------------------------------------------
      - name: Dry-run summary
        if: >
          steps.check.outputs.skip == 'false' &&
          inputs.dry_run == true
        env:
          FILES_CHANGED: ${{ steps.generate.outputs.files_changed }}
          AUTO_CIT_FILE: ${{ steps.generate.outputs.auto_cit_file }}
          WORK_DIR: ${{ steps.generate.outputs.work_dir }}
        run: |
          REPO="${{ inputs.repo }}"

          if [ "${FILES_CHANGED}" = "true" ]; then
            echo "::notice::DRY RUN – would create update-citation-cff PR in ${REPO} targeting '${{ inputs.branch }}'."
          else
            echo "::notice::DRY RUN – inst/CITATION and CITATION.cff are already up to date in ${REPO}; no PR needed."
          fi

          echo "==> Auto citation (citation(\"${REPO}\", auto = TRUE)):"
          cat "${AUTO_CIT_FILE}"

          rm -f "${AUTO_CIT_FILE}"
          rm -rf "${WORK_DIR}"

      # -----------------------------------------------------------------------
      # 6. Nothing to do
      # -----------------------------------------------------------------------
      - name: No action needed
        if: steps.check.outputs.skip == 'true'
        run: |
          echo "::notice::${{ inputs.repo }} does not need citation files updated – skipped."
