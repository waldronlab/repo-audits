name: Security Code Review

on:
  workflow_dispatch:
    inputs:
      repo:
        description: >
          Repository name within the waldronlab organisation to review
          (e.g. MultiAssayExperiment)
        required: true
        type: string
      branch:
        description: >
          Branch to review (e.g. devel, RELEASE_3_22)
        required: false
        type: string
        default: devel
      model:
        description: >
          Gemini model to use for the security review
          (e.g. gemini-2.5-pro-preview-03-25, gemini-2.0-flash)
        required: false
        type: string
        default: gemini-2.5-pro-preview-03-25
      dry_run:
        description: >
          Dry run – perform the review and print findings,
          but do NOT open a GitHub issue in the target repository
        required: false
        type: boolean
        default: false

env:
  ORG: waldronlab

jobs:
  security-code-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # -----------------------------------------------------------------------
      # 0. Checkout repo-audits so scripts/ are available locally
      # -----------------------------------------------------------------------
      - uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 1. Check eligibility of the target repository
      # -----------------------------------------------------------------------
      - name: Check eligibility
        id: check
        env:
          GH_TOKEN: ${{ secrets.AUDIT_PAT }}
          TARGET_BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          REPO="${{ inputs.repo }}"

          echo "==> Checking ${ORG}/${REPO} …"

          # --- Fetch repo metadata -------------------------------------------
          if ! REPO_JSON=$(gh api "repos/${ORG}/${REPO}" 2>&1); then
            echo "::error::Repository ${ORG}/${REPO} not found or not accessible."
            exit 1
          fi

          IS_FORK=$(echo "${REPO_JSON}"     | jq -r '.fork')
          IS_ARCHIVED=$(echo "${REPO_JSON}" | jq -r '.archived')

          if [ "${IS_FORK}" = "true" ]; then
            echo "::notice::Skipping ${REPO} – it is a fork."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [ "${IS_ARCHIVED}" = "true" ]; then
            echo "::notice::Skipping ${REPO} – it is archived."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Require the target branch to exist
          if ! gh api "repos/${ORG}/${REPO}/branches/${TARGET_BRANCH}" > /dev/null 2>&1; then
            echo "::notice::Skipping ${REPO} – branch '${TARGET_BRANCH}' not found."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "skip=false" >> "${GITHUB_OUTPUT}"
          echo "==> ${REPO} is eligible for security code review."

      # -----------------------------------------------------------------------
      # 2. Create the single-entry package list for the shell script
      # -----------------------------------------------------------------------
      - name: Create package list
        if: steps.check.outputs.skip == 'false'
        run: |
          # Tab-separated "PackageName <TAB> URL" so the script clones from GitHub
          printf '%s\thttps://github.com/%s/%s\n' \
            "${{ inputs.repo }}" \
            "${ORG}" \
            "${{ inputs.repo }}" > /tmp/bioc_pkgs.txt
          echo "==> Package list:"
          cat /tmp/bioc_pkgs.txt

      # -----------------------------------------------------------------------
      # 3. Run AI security review via shell script
      # -----------------------------------------------------------------------
      - name: Run AI security review
        if: steps.check.outputs.skip == 'false'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ inputs.model }}
          PACKAGE_LIST: /tmp/bioc_pkgs.txt
          BIOC_GIT_BRANCH: ${{ inputs.branch }}
          SECURITY_INSTRUCTIONS_FILE: ${{ github.workspace }}/scripts/instructions.md
          AUDIT_DIR: /tmp/audit
          REPOS_DIR: /tmp/repos
          SKIP_WRAPUP: "0"
        run: |
          set -euo pipefail
          bash "${{ github.workspace }}/scripts/bulk_security_review.sh"
          echo "==> Security review completed."

      # -----------------------------------------------------------------------
      # 4a. Open or refresh GitHub issue in the target repo (real run)
      # -----------------------------------------------------------------------
      - name: Open or refresh GitHub issue
        if: steps.check.outputs.skip == 'false' && inputs.dry_run == false
        env:
          GH_TOKEN: ${{ secrets.AUDIT_PAT }}
        run: |
          set -euo pipefail
          REPO="${{ inputs.repo }}"
          REVIEW_FILE="/tmp/audit/reviews/${REPO}_security_review.md"
          ISSUE_TITLE="Security code review"

          if [[ ! -f "$REVIEW_FILE" ]]; then
            echo "::error::Review file not found at $REVIEW_FILE – the audit may have failed."
            exit 1
          fi

          # Close any existing open issue with the same title to avoid accumulation
          EXISTING=$(gh issue list \
            --repo "${ORG}/${REPO}" \
            --state open \
            --search "${ISSUE_TITLE} in:title" \
            --json number \
            --jq '.[0].number' 2>/dev/null || true)

          if [ -n "${EXISTING}" ]; then
            echo "==> Closing stale issue #${EXISTING} before opening a fresh one."
            gh issue close "${EXISTING}" \
              --repo "${ORG}/${REPO}" \
              --comment "$(printf 'Superseded by a new security code review.\n\nNew run: [#%s](%s/%s/actions/runs/%s).' \
                "${{ github.run_id }}" \
                "${{ github.server_url }}" \
                "${{ github.repository }}" \
                "${{ github.run_id }}")"
          fi

          # Append run attribution to the review body
          BODY_FILE=$(mktemp)
          cat "$REVIEW_FILE" > "${BODY_FILE}"
          printf '\n---\n_Generated by the [repo-audits](https://github.com/waldronlab/repo-audits) Security Code Review workflow (run [#%s](%s/%s/actions/runs/%s)) using model `%s` on branch `%s`._\n' \
            "${{ github.run_id }}" \
            "${{ github.server_url }}" \
            "${{ github.repository }}" \
            "${{ github.run_id }}" \
            "${{ inputs.model }}" \
            "${{ inputs.branch }}" >> "${BODY_FILE}"

          # Create the issue; try with the 'security' label first, fall back without
          ISSUE_URL=$(gh issue create \
            --repo "${ORG}/${REPO}" \
            --title "${ISSUE_TITLE}" \
            --body-file "${BODY_FILE}" \
            --label "security" 2>/dev/null \
            || gh issue create \
              --repo "${ORG}/${REPO}" \
              --title "${ISSUE_TITLE}" \
              --body-file "${BODY_FILE}")

          rm -f "${BODY_FILE}"
          echo "::notice::Security review issue opened: ${ISSUE_URL}"

      # -----------------------------------------------------------------------
      # 4b. Dry-run: print the review to the log
      # -----------------------------------------------------------------------
      - name: Dry-run summary
        if: steps.check.outputs.skip == 'false' && inputs.dry_run == true
        run: |
          REVIEW_FILE="/tmp/audit/reviews/${{ inputs.repo }}_security_review.md"
          echo "::notice::DRY RUN – review complete; no issue was opened in ${{ inputs.repo }}."
          echo "==> Review output:"
          cat "$REVIEW_FILE"

      # -----------------------------------------------------------------------
      # 4c. Skipped
      # -----------------------------------------------------------------------
      - name: Skipped
        if: steps.check.outputs.skip == 'true'
        run: |
          echo "::notice::${{ inputs.repo }} was skipped – not eligible for security code review."
