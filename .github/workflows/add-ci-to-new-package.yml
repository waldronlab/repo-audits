name: Add or update ci.yml (Bioconductor/workflows)

on:
  workflow_dispatch:
    inputs:
      repo:
        description: >
          Repository name within the waldronlab organisation to add ci.yml to
          (e.g. MultiAssayExperiment)
        required: true
        type: string
      branch:
        description: >
          Target branch to search and open PRs against
          (e.g. devel, RELEASE_3_22)
        required: false
        type: string
        default: devel
      workflow_ref:
        description: >
          Ref (branch or tag) of Bioconductor/workflows to reference in the
          `uses:` line (e.g. main). Applies to both new and existing ci files.
        required: false
        type: string
        default: main
      enable_pkgdown:
        description: >
          New ci.yml only: passed as `enable_pkgdown:` in the with: block.
          Existing workflows keep their current value.
        required: false
        type: boolean
        default: true
      enable_cyclocomp:
        description: >
          New ci.yml only: passed as `enable_cyclocomp:` in the with: block.
        required: false
        type: boolean
        default: false
      error_on:
        description: >
          New ci.yml only: rcmdcheck error policy (never, note, warning, error).
        required: false
        type: choice
        options: [never, note, warning, error]
        default: warning
      dry_run:
        description: >
          Dry run – perform all checks and show what would change,
          but do NOT push branches, commits, or open PRs
        required: false
        type: boolean
        default: false

env:
  ORG: waldronlab

jobs:
  add-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # -----------------------------------------------------------------------
      # 0. Checkout repo-audits@devel so scripts/ are available locally
      # -----------------------------------------------------------------------
      - uses: actions/checkout@v4
        with:
          ref: devel


      # -----------------------------------------------------------------------
      # 1. Check eligibility and decide whether to add or update
      # -----------------------------------------------------------------------
      - name: Check eligibility
        id: check
        env:
          GH_TOKEN: ${{ secrets.AUDIT_PAT }}
          TARGET_BRANCH: ${{ inputs.branch }}
          NEW_USES_PREFIX: Bioconductor/workflows/.github/workflows/bioccheck.yml
        run: |
          set -euo pipefail
          REPO="${{ inputs.repo }}"

          echo "==> Checking ${ORG}/${REPO} …"

          if ! REPO_JSON=$(gh api "repos/${ORG}/${REPO}" 2>&1); then
            echo "::error::Repository ${ORG}/${REPO} not found or not accessible."
            exit 1
          fi

          IS_FORK=$(echo "${REPO_JSON}"     | jq -r '.fork')
          IS_ARCHIVED=$(echo "${REPO_JSON}" | jq -r '.archived')

          skip() {
            echo "::notice::Skipping ${REPO} – $1"
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          }

          [ "${IS_FORK}" = "true" ]     && skip "it is a fork."
          [ "${IS_ARCHIVED}" = "true" ] && skip "it is archived."

          if ! gh api "repos/${ORG}/${REPO}/branches/${TARGET_BRANCH}" > /dev/null 2>&1; then
            skip "branch '${TARGET_BRANCH}' not found."
          fi

          # Skip if an open PR from this workflow already exists
          EXISTING_PR=$(gh pr list \
            --repo "${ORG}/${REPO}" \
            --state open \
            --search "Bioconductor/workflows in:title" \
            --json number \
            --jq '.[0].number' 2>/dev/null || true)
          if [ -n "${EXISTING_PR}" ]; then
            skip "PR #${EXISTING_PR} already open."
          fi

          # Scan existing workflow files for references to the reusable workflow
          WF_LIST=$(gh api \
            "repos/${ORG}/${REPO}/contents/.github/workflows?ref=${TARGET_BRANCH}" \
            --jq '.[] | select(.type=="file") | select(.name | test("\\.ya?ml$")) | .name' \
            2>/dev/null || true)

          TO_UPDATE=""
          ALREADY_NEW=""
          for F in ${WF_LIST}; do
            CONTENT=$(gh api \
              "repos/${ORG}/${REPO}/contents/.github/workflows/${F}?ref=${TARGET_BRANCH}" \
              --jq '.content' | base64 -d)
            if printf '%s\n' "${CONTENT}" | grep -Eq 'uses:[[:space:]]*waldronlab/\.github/\.github/workflows/'; then
              TO_UPDATE="${TO_UPDATE} ${F}"
            elif printf '%s\n' "${CONTENT}" | grep -Fq "${NEW_USES_PREFIX}"; then
              ALREADY_NEW="${ALREADY_NEW} ${F}"
            fi
          done

          if [ -n "${TO_UPDATE}" ]; then
            echo "mode=update" >> "${GITHUB_OUTPUT}"
            echo "files=${TO_UPDATE# }" >> "${GITHUB_OUTPUT}"
            echo "skip=false" >> "${GITHUB_OUTPUT}"
            echo "==> ${REPO}: will update:${TO_UPDATE}"
            exit 0
          fi

          if [ -n "${ALREADY_NEW}" ]; then
            skip "already uses Bioconductor/workflows (${ALREADY_NEW# })."
          fi

          if echo "${WF_LIST}" | grep -qx 'ci.yml'; then
            skip "ci.yml exists but does not reference a shared reusable workflow; review manually."
          fi

          echo "mode=add" >> "${GITHUB_OUTPUT}"
          echo "files=ci.yml" >> "${GITHUB_OUTPUT}"
          echo "skip=false" >> "${GITHUB_OUTPUT}"
          echo "==> ${REPO} is eligible – ci.yml will be added."

      # -----------------------------------------------------------------------
      # 2. Create branch and open PR (real run)
      # -----------------------------------------------------------------------
      - name: Create branch and open PR
        if: >
          steps.check.outputs.skip == 'false' &&
          inputs.dry_run == false
        env:
          GH_TOKEN: ${{ secrets.AUDIT_PAT }}
          TARGET_BRANCH: ${{ inputs.branch }}
          WORKFLOW_REF: ${{ inputs.workflow_ref }}
          ENABLE_PKGDOWN: ${{ inputs.enable_pkgdown }}
          ENABLE_CYCLOCOMP: ${{ inputs.enable_cyclocomp }}
          ERROR_ON: ${{ inputs.error_on }}
          MODE: ${{ steps.check.outputs.mode }}
          FILES: ${{ steps.check.outputs.files }}
        run: |
          set -euo pipefail
          REPO="${{ inputs.repo }}"
          BRANCH="ci/bioconductor-workflows-${{ github.run_id }}"
          NEW_USES="Bioconductor/workflows/.github/workflows/bioccheck.yml@${WORKFLOW_REF}"

          if [[ ! "${WORKFLOW_REF}" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::Invalid workflow_ref '${WORKFLOW_REF}'."
            exit 1
          fi

          BASE_SHA=$(gh api "repos/${ORG}/${REPO}/branches/${TARGET_BRANCH}" \
                       --jq '.commit.sha')
          gh api "repos/${ORG}/${REPO}/git/refs" \
            --method POST \
            --field "ref=refs/heads/${BRANCH}" \
            --field "sha=${BASE_SHA}"
          echo "  Created branch: ${BRANCH} (off ${TARGET_BRANCH})"

          if [ "${MODE}" = "add" ]; then
            printf '%s\n' \
              'name: PR CMD check & build site' \
              '' \
              'on:' \
              '  pull_request:' \
              '  push:' \
              '    paths:' \
              "      - 'DESCRIPTION'" \
              "      - '**.yml'" \
              '    branches:' \
              '      - devel' \
              "      - 'RELEASE_*'" \
              '' \
              'jobs:' \
              '  ci:' \
              "    uses: ${NEW_USES}" \
              '    with:' \
              "      enable_pkgdown: ${ENABLE_PKGDOWN}" \
              "      enable_cyclocomp: ${ENABLE_CYCLOCOMP}" \
              "      error_on: '${ERROR_ON}'" \
              '    secrets: inherit' \
              '    permissions:' \
              '      contents: write' \
              '      pages: write' \
              '      id-token: write' > ci.yml.new
            CI_YML=$(base64 -w0 ci.yml.new)
            gh api "repos/${ORG}/${REPO}/contents/.github/workflows/ci.yml" \
              --method PUT \
              --field "message=Add ci.yml calling Bioconductor/workflows" \
              --field "content=${CI_YML}" \
              --field "branch=${BRANCH}"
            echo "  Added .github/workflows/ci.yml"
            BODY_SRC=scripts/add-ci-pr-body.md
            TITLE="Add ci.yml using Bioconductor/workflows bioccheck"
          else
            for F in ${FILES}; do
              API="repos/${ORG}/${REPO}/contents/.github/workflows/${F}"
              META=$(gh api "${API}?ref=${BRANCH}")
              SHA=$(echo "${META}" | jq -r '.sha')
              echo "${META}" | jq -r '.content' | base64 -d > "wf.yml"
              RESULT=$(python3 scripts/update_ci_reference.py wf.yml "${NEW_USES}")
              if [ "${RESULT}" = "changed" ]; then
                gh api "${API}" \
                  --method PUT \
                  --field "message=Update ${F} to use Bioconductor/workflows bioccheck" \
                  --field "content=$(base64 -w0 wf.yml)" \
                  --field "sha=${SHA}" \
                  --field "branch=${BRANCH}"
                echo "  Updated .github/workflows/${F}"
              fi
            done
            BODY_SRC=scripts/update-ci-pr-body.md
            TITLE="Update CI to use Bioconductor/workflows bioccheck"
          fi

          PR_BODY_FILE=$(mktemp)
          cp "${BODY_SRC}" "${PR_BODY_FILE}"
          printf '\nOpened by the [repo-audits](https://github.com/waldronlab/repo-audits) workflow (run [#%s](%s/%s/actions/runs/%s)).\n' \
            "${{ github.run_id }}" \
            "${{ github.server_url }}" \
            "${{ github.repository }}" \
            "${{ github.run_id }}" >> "${PR_BODY_FILE}"

          gh pr create \
            --repo "${ORG}/${REPO}" \
            --base "${TARGET_BRANCH}" \
            --head "${BRANCH}" \
            --title "${TITLE}" \
            --body-file "${PR_BODY_FILE}"

          rm -f "${PR_BODY_FILE}"
          echo "::notice::PR (${MODE}) created in ${ORG}/${REPO} targeting '${TARGET_BRANCH}' (branch: ${BRANCH}, uses: ${NEW_USES})."

      # -----------------------------------------------------------------------
      # 3. Dry-run summary
      # -----------------------------------------------------------------------
      - name: Dry-run summary
        if: >
          steps.check.outputs.skip == 'false' &&
          inputs.dry_run == true
        env:
          MODE: ${{ steps.check.outputs.mode }}
          FILES: ${{ steps.check.outputs.files }}
        run: |
          echo "::notice::DRY RUN – would ${MODE} (${FILES}) in ${{ inputs.repo }} targeting '${{ inputs.branch }}' using Bioconductor/workflows/.github/workflows/bioccheck.yml@${{ inputs.workflow_ref }}."

      # -----------------------------------------------------------------------
      # 4. Nothing to do
      # -----------------------------------------------------------------------
      - name: No action needed
        if: steps.check.outputs.skip == 'true'
        run: |
          echo "::notice::${{ inputs.repo }} needs no change – skipped."
