name: Add ci.yml to new package

on:
  workflow_dispatch:
    inputs:
      repo:
        description: >
          Repository name within the waldronlab organisation to add ci.yml to
          (e.g. MultiAssayExperiment)
        required: true
        type: string
      branch:
        description: >
          Target branch to search and open PRs against
          (e.g. devel, RELEASE_3_22)
        required: false
        type: string
        default: devel
      workflow_version:
        description: >
          Version tag of the reusable workflow to reference in ci.yml
          (e.g. devel, v1). This becomes the @<version> suffix in the
          `uses:` line of the generated ci.yml.
        required: false
        type: string
        default: devel
      enable_pkgdown:
        description: >
          If true, build and deploy pkgdown when on a RELEASE_* branch push.
          Passed as `enable_pkgdown:` in the generated ci.yml with: block.
        required: false
        type: boolean
        default: true
      enable_docker:
        description: >
          If true, build and push a Docker image when a Dockerfile exists and
          on a devel push. Passed as `enable_docker:` in the generated ci.yml
          with: block.
        required: false
        type: boolean
        default: true
      dockerfile_path:
        description: >
          Path to the Dockerfile to build (relative to the repository root).
          Passed as `dockerfile_path:` in the generated ci.yml with: block.
        required: false
        type: string
        default: inst/docker/pkg/Dockerfile
      cran:
        description: >
          CRAN-like repository URL to use for package installation. Leave
          blank to use the reusable workflow default
          (https://p3m.dev/cran/__linux__/noble/latest).
          If non-empty, passed as `cran:` in the generated ci.yml with: block.
        required: false
        type: string
        default: ''
      dry_run:
        description: >
          Dry run – perform all checks and show what would change,
          but do NOT push branches, commits, or open PRs
        required: false
        type: boolean
        default: false

env:
  ORG: waldronlab

jobs:
  add-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # -----------------------------------------------------------------------
      # 0. Checkout repo-audits@devel so scripts/ are available locally
      # -----------------------------------------------------------------------
      - uses: actions/checkout@v4
        with:
          ref: devel

      # -----------------------------------------------------------------------
      # 1. Check eligibility of the target repository
      # -----------------------------------------------------------------------
      - name: Check eligibility
        id: check
        env:
          GH_TOKEN: ${{ secrets.AUDIT_PAT }}
          TARGET_BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          REPO="${{ inputs.repo }}"

          echo "==> Checking ${ORG}/${REPO} …"

          # --- Fetch repo metadata -------------------------------------------
          if ! REPO_JSON=$(gh api "repos/${ORG}/${REPO}" 2>&1); then
            echo "::error::Repository ${ORG}/${REPO} not found or not accessible."
            exit 1
          fi

          IS_FORK=$(echo "${REPO_JSON}"     | jq -r '.fork')
          IS_ARCHIVED=$(echo "${REPO_JSON}" | jq -r '.archived')

          if [ "${IS_FORK}" = "true" ]; then
            echo "::notice::Skipping ${REPO} – it is a fork."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [ "${IS_ARCHIVED}" = "true" ]; then
            echo "::notice::Skipping ${REPO} – it is archived."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Require the target branch to exist
          if ! gh api "repos/${ORG}/${REPO}/branches/${TARGET_BRANCH}" > /dev/null 2>&1; then
            echo "::notice::Skipping ${REPO} – branch '${TARGET_BRANCH}' not found."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Skip if ci.yml already exists on the target branch
          if gh api \
            "repos/${ORG}/${REPO}/contents/.github/workflows/ci.yml?ref=${TARGET_BRANCH}" \
            > /dev/null 2>&1; then
            echo "::notice::Skipping ${REPO} – ci.yml already exists on '${TARGET_BRANCH}'."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Skip if an add-ci PR already exists
          EXISTING_PR=$(gh pr list \
            --repo "${ORG}/${REPO}" \
            --state open \
            --search "Add ci.yml in:title" \
            --json number \
            --jq '.[0].number' 2>/dev/null || true)
          if [ -n "${EXISTING_PR}" ]; then
            echo "::notice::Skipping ${REPO} – add-ci PR #${EXISTING_PR} already open."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "skip=false" >> "${GITHUB_OUTPUT}"
          echo "==> ${REPO} is eligible – ci.yml will be added."

      # -----------------------------------------------------------------------
      # 2. Create branch and open PR (real run)
      # -----------------------------------------------------------------------
      - name: Create branch and open PR
        if: >
          steps.check.outputs.skip == 'false' &&
          inputs.dry_run == false
        env:
          GH_TOKEN: ${{ secrets.AUDIT_PAT }}
          TARGET_BRANCH: ${{ inputs.branch }}
          WORKFLOW_VERSION: ${{ inputs.workflow_version }}
          ENABLE_PKGDOWN: ${{ inputs.enable_pkgdown }}
          ENABLE_DOCKER: ${{ inputs.enable_docker }}
          DOCKERFILE_PATH: ${{ inputs.dockerfile_path }}
          CRAN: ${{ inputs.cran }}
        run: |
          set -euo pipefail
          REPO="${{ inputs.repo }}"
          BRANCH="ci/add-ci-yml-${{ github.run_id }}"

          # ── Validate string inputs won't break YAML ──
          for VAR in DOCKERFILE_PATH CRAN; do
            VAL="${!VAR}"
            if [[ "${VAL}" == *$'\n'* || "${VAL}" == *$'\r'* ]]; then
              echo "::error::Input '${VAR}' must not contain newline characters."
              exit 1
            fi
          done

          # ── Build the with: block; cran is optional ──
          WITH_PARAMS=""
          if [ -n "${CRAN}" ]; then
            WITH_PARAMS="${WITH_PARAMS}      cran: ${CRAN}\n"
          fi
          WITH_PARAMS="${WITH_PARAMS}      enable_pkgdown: ${ENABLE_PKGDOWN}\n"
          WITH_PARAMS="${WITH_PARAMS}      enable_docker: ${ENABLE_DOCKER}\n"
          WITH_PARAMS="${WITH_PARAMS}      dockerfile_path: ${DOCKERFILE_PATH}"

          # ── Generate ci.yml content ──
          CI_YML_CONTENT=$(printf '%s\n' \
            'name: PR CMD check & build site' \
            '' \
            'on:' \
            '  pull_request:' \
            '  push:' \
            '    paths:' \
            "      - 'DESCRIPTION'" \
            "      - '**.yml'" \
            '    branches:' \
            '      - devel' \
            "      - 'RELEASE_*'" \
            '' \
            'jobs:' \
            '  ci:' \
            "    uses: waldronlab/.github/.github/workflows/bioc-pr-cmdcheck-pkgdown.yml@${WORKFLOW_VERSION}" \
            '    with:' \
            "$(printf '%b' "${WITH_PARAMS}")" \
            '    secrets: inherit' \
            '    permissions:' \
            '      contents: write' \
            '      pages: write' \
            '      id-token: write')
          CI_YML=$(printf '%s' "${CI_YML_CONTENT}" | base64 -w0)

          # ── Create a branch off the target branch ──
          BASE_SHA=$(gh api "repos/${ORG}/${REPO}/branches/${TARGET_BRANCH}" \
                       --jq '.commit.sha')

          gh api "repos/${ORG}/${REPO}/git/refs" \
            --method POST \
            --field "ref=refs/heads/${BRANCH}" \
            --field "sha=${BASE_SHA}"
          echo "  Created branch: ${BRANCH} (off ${TARGET_BRANCH})"

          # ── Add ci.yml ──
          gh api "repos/${ORG}/${REPO}/contents/.github/workflows/ci.yml" \
            --method PUT \
            --field "message=Add ci.yml reusable-workflow wrapper" \
            --field "content=${CI_YML}" \
            --field "branch=${BRANCH}"
          echo "  Added .github/workflows/ci.yml"

          # ── Build PR body ──
          PR_BODY_FILE=$(mktemp)
          cp scripts/add-ci-pr-body.md "${PR_BODY_FILE}"
          printf '\nOpened by the [repo-audits](https://github.com/waldronlab/repo-audits) workflow (run [#%s](%s/%s/actions/runs/%s)).\n' \
            "${{ github.run_id }}" \
            "${{ github.server_url }}" \
            "${{ github.repository }}" \
            "${{ github.run_id }}" >> "${PR_BODY_FILE}"

          # ── Open PR ──
          gh pr create \
            --repo "${ORG}/${REPO}" \
            --base "${TARGET_BRANCH}" \
            --head "${BRANCH}" \
            --title "Add ci.yml reusable-workflow wrapper" \
            --body-file "${PR_BODY_FILE}"

          rm -f "${PR_BODY_FILE}"

          echo "::notice::PR created in ${ORG}/${REPO} targeting '${TARGET_BRANCH}' (branch: ${BRANCH}, version: ${WORKFLOW_VERSION}, enable_pkgdown: ${ENABLE_PKGDOWN}, enable_docker: ${ENABLE_DOCKER}, dockerfile_path: ${DOCKERFILE_PATH})."

      # -----------------------------------------------------------------------
      # 3. Dry-run summary
      # -----------------------------------------------------------------------
      - name: Dry-run summary
        if: >
          steps.check.outputs.skip == 'false' &&
          inputs.dry_run == true
        env:
          CRAN_MSG: ${{ inputs.cran != '' && format(', cran={0}', inputs.cran) || '' }}
        run: |
          echo "::notice::DRY RUN – would create add-ci PR in \
          ${{ inputs.repo }} targeting '${{ inputs.branch }}' \
          with workflow version '${{ inputs.workflow_version }}', \
          enable_pkgdown=${{ inputs.enable_pkgdown }}, \
          enable_docker=${{ inputs.enable_docker }}, \
          dockerfile_path='${{ inputs.dockerfile_path }}'${CRAN_MSG}."

      # -----------------------------------------------------------------------
      # 4. Nothing to do
      # -----------------------------------------------------------------------
      - name: No action needed
        if: steps.check.outputs.skip == 'true'
        run: |
          echo "::notice::${{ inputs.repo }} does not need ci.yml added – skipped."
